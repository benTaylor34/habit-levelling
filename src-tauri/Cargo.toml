[package]
name = "habit_levelling"
version.workspace = true
description = "Habit Levelling - a local-first habit tracker"
authors = ["you"]
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "habit_levelling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
habit_core = { workspace = true, features = ["sqlx"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# Release profile settings are in the workspace Cargo.toml at the repo root.
