# Cargo workspace for Habit Levelling.
#
# - crates/core: the pure game rules (stats, XP, streaks, decay, luck, history,
#   activity, stat suggestions) and their data types. No database, no UI, no
#   platform code, so desktop, Android and any future web or server version
#   can all build on it.
# - src-tauri: the Tauri app. Storage (SQLite), backups and the commands the
#   React UI calls, built on top of habit_core.
[workspace]
members = ["crates/core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
habit_core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# Profiles only take effect at the workspace root.
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
